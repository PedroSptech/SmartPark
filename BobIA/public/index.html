<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA | Smart Park</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <h1>BobIA</h1>

        <p style="color:#1F2A44; margin-bottom:15px;">
            Olá! Sou o BobIA, assistente virtual da Smart Park.
            Estou aqui para ajudar com informações sobre estacionamentos,
            vagas, mobilidade urbana e tirar suas dúvidas de forma rápida.
        </p>

        <textarea id="pergunta" type="text" placeholder="Como posso ajudar você hoje?"></textarea>

        <br><br>

        <button onclick="gerarResposta()">Perguntar ao BobIA</button>

        <h3>Resposta do BobIA:</h3>

        <div id="resposta"></div>
    </div>

    <script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>
    
</body>
</html>
