<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmartPark — Cadastro de Empresa</title>
	<meta name="description"
		content="Cadastre sua empresa no SmartPark e comece a gerenciar seus estacionamentos com inteligência.">
	<link rel="stylesheet" href="../css/login_reg.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="icon" href="../images/LOGO.svg">
	<link
		href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
		rel="stylesheet">
</head>

<body>
	<div class="page">
		<div class="structure">
			<div class="home home-registro">
				<a href="../index.html" class="btn-home btn">HOME</a>
			</div>

				<div class="tab-switcher" id="tabSwitcher">
					<button class="tab-btn tab-active" id="tabEmpresa" onclick="switchTab('empresa', 2)">Empresa</button>
					<button class="tab-btn" id="tabFuncionario" onclick="switchTab('funcionario', 2)">Funcionário</button>
				</div>

			<div class="form" id="formEmpresa">
				<p class="title">CADASTRO DE EMPRESA</p>
				
				<div class="card_erro" id="cardErro">
					<span id="error_message"></span>
				</div>

				<div class="card_message" id="cardMessage">
					<span id="success_message"></span>
				</div>

				<div id="formCadastro" class="form-group">
					<label class="input-text" for="ipt_cnpj">CNPJ</label>
					<input type="text" class="input" id="ipt_cnpj" placeholder="00.000.000/0000-00" maxlength="14">

					<label class="input-text" for="ipt_rzsocial">Razão Social</label>
					<input type="text" class="input" id="ipt_rzsocial" placeholder="Nome da sua empresa">

					<label class="input-text" for="ipt_logradouro">Logradouro</label>
					<input type="text" class="input" id="ipt_logradouro" placeholder="Rua, Av...">

					<div class="form-row">
						<div>
							<label class="input-text" for="ipt_cep">CEP</label>
							<input type="text" class="input" id="ipt_cep" placeholder="00000-000" maxlength="8">
						</div>
						<div>
							<label class="input-text" for="ipt_numero">Número</label>
							<input type="number" class="input" id="ipt_numero" placeholder="123">
						</div>
					</div>

					<div class="form-row">
						<div>
							<label class="input-text" for="ipt_cidade">Cidade</label>
							<input type="text" class="input" id="ipt_cidade" placeholder="São Paulo">
						</div>
						<div>
							<label class="input-text" for="ipt_estado">Estado (UF)</label>
							<input type="text" class="input" id="ipt_estado" placeholder="SP" maxlength="2">
						</div>
					</div>

					<label class="input-text" for="ipt_passw">Senha</label>
					<input type="password" class="input" id="ipt_passw">

					<label class="input-text" for="ipt_confirm_passw">Confirmar Senha</label>
					<input type="password" class="input" id="ipt_confirm_passw">

					<button class="btn btn-cadastro" onclick="cadastrarEmpresa()" id="btn_submit">Cadastrar</button>
					<p class="input-text" style="margin-top:12px;">Já tem conta? <a href="./login.html">Entre!</a></p>

					<div class="loading" id="loading_gif">
         		<img src="../images/gifs/loading.gif">
      		</div>
				</div>
			</div>
			
			
			<div class="form" id="formFuncionario" style="display:none;">
				<p class="title">CADASTRO DE FUNCIONÁRIO</p>
	
				<div class="card_erro" id="cardErro">
					<span id="error_message"></span>
				</div>
				
				<div class="card_message" id="cardMessage">
					<span id="success_message"></span>
				</div>
				
				<div id="codigoInfo" class="codigo_info">
					<strong>Como funciona?</strong> Seu gestor ou empresa fornecerá um código único. Insira-o abaixo para vincular seu cadastro.
				</div>
	
				<label class="input-text" for="ipt_codigo_empresa">Código da Empresa</label>
				<input type="text" class="input" id="ipt_codigo_empresa" placeholder="Ex: 38X2K9">
				<br>
				
				<label class="input-text" for="ipt_nome_func">Nome Completo</label>
				<input type="text" class="input" id="ipt_nome_func" placeholder="Seu nome">
				<br>
				
				<label class="input-text" for="ipt_email_func_reg">Email</label>
				<input type="email" class="input" id="ipt_email_func_reg" placeholder="seu@email.com">
				<br>
				
				<label class="input-text" for="ipt_passw_func">Senha</label>
				<input type="password" class="input" id="ipt_passw_func">
				<br>
				
				<label class="input-text" for="ipt_confirm_passw_func">Confirmar Senha</label>
				<input type="password" class="input" id="ipt_confirm_passw_func">
				
				<button class="btn btn-cadastro">Cadastrar</button>
				<br>
				<p class="input-text">Já tem conta? <a href="./login.html">Entre!</a></p>
			</div>
		</div>
		
		<div class="image-box image-box-cadastro">
			<img class="image-cadastro" src="../images/logo-image.svg" alt="SmartPark">
		</div>
	</div>
</body>
<script src="../scripts/user.js"></script>
<script src="../scripts/helper.js"></script>

</html>
