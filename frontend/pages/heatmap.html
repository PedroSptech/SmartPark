<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark - Mapa de Calor</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="seta">
        <a href="dashboard.html">
            <img src="../images/Seta.svg" alt="Voltar">
        </a>
    </div>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-pill">
                <div class="icon">
                    <a href="../pages/dashboard.html">
                        <img src="../images/category-gray.svg" alt="Dashboard">
                    </a>
                </div>
                <div class="icon" id="botao_perfil">
                    <a href="../pages/profile_page.html">
                        <img src="../images/Vector.svg" alt="Perfil">
                    </a>
                </div>
                <div class="icon">
                    <a href="../pages/heatmap.html">
                        <img src="../images/Chart-blue.svg" alt="Perfil">
                    </a>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <header class="top-bar">
                <div class="logo">
                    <img src="../images/LOGO.svg" alt="Ícone Carro" class="logo-icon">
                    <span class="logo-text">SmartPark</span>
                </div>
                <div class="user-info">
                    SPTECH | sptech@sptech.school
                </div>
            </header>

            <section class="charts-container heatmap-section">
                <div class="chart-card heatmap-card">
                    <h4>Mapa de Calor - Ocupação em Tempo Real (G1)</h4>
                    <div class="chart-wrapper heatmap-wrapper">
                        <canvas id="heatmapChart"></canvas>
                    </div>
                </div>

                <div class="cards-alertas">

                    <div class="card-kpi">
                        <h4 class="kpi-titulo">Setor selecionado</h4>

                        <p class="kpi-hint" id="kpi-vazio">
                            Clique em uma bolha no mapa para ver os detalhes do setor.
                        </p>

                        <div id="kpi-detalhe" style="display:none;">
                            <div class="card-alerta" id="kpi-banner-setor">
                                <span class="alerta-icone" id="kpi-icone-setor"></span>
                                <div class="alerta-texto">
                                    <h3 id="kpi-nome-setor">—</h3>
                                    <p id="kpi-taxa-geral"></p>
                                </div>
                            </div>
                            <div class="alertas-container" id="kpi-lista-tipos"></div>
                        </div>
                    </div>

                    <div class="card-kpi">
                        <h4 class="kpi-titulo">Setores em alerta</h4>
                        <div class="alertas-container" id="kpi-lista-criticos">
                            <p class="kpi-hint">Carregando...</p>
                        </div>
                    </div>

                    <div class="card-kpi">
                        <h4 class="kpi-titulo">Setores vazios</h4>
                        <div class="alertas-container" id="kpi-lista-vazios">
                            <p class="kpi-hint">Carregando...</p>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script src="../scripts/heatmap.js"></script>
</body>

</html>
