<!doctype html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SmartPark — Login</title>
	<meta name="description" content="Acesse sua conta SmartPark como empresa ou funcionário." />
	<link rel="stylesheet" href="../css/login_reg.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
		rel="stylesheet" />
	<link rel="icon" href="../images/LOGO.svg">
</head>

<body>
	<div class="page">
		<div class="image-box image-box-login">
			<img class="image-login" src="../images/logo-image.svg" alt="SmartPark" />
		</div>

		<div class="structure">
			<div class="home home-login">
				<a href="../index.html" class="btn-home btn">HOME</a>
			</div>

			<div class="form">
				<p class="title">LOGIN</p>

				<div class="tab-switcher" id="tabSwitcher">
					<button class="tab-btn tab-active" id="tabEmpresa" onclick="switchTab('empresa')">Empresa</button>
					<button class="tab-btn" id="tabFuncionario" onclick="switchTab('funcionario')">Funcionário</button>
				</div>

				<div class="card_erro" id="cardErro">
					<span id="error_message"></span>
				</div>

				<div id="formEmpresa">
					<label class="input-text" for="ipt_cnpj_login">CNPJ</label>
					<input type="text" class="input" id="ipt_cnpj_em" placeholder="00.000.000/0000-00">
					<br>
					<label class="input-text" for="ipt_passw_login">Senha</label>
					<input type="password" class="input" id="ipt_passw_em">
					<button class="btn btn-login" onclick="loginUser()">Entrar</button>
				</div>

				<div id="formFuncionario" style="display:none;">
					<label class="input-text" for="ipt_email">Email</label>
					<input type="email" class="input" id="ipt_email" placeholder="seu@email.com">
					<br>
					<label class="input-text" for="ipt_passw">Senha</label>
					<input type="password" class="input" id="ipt_passw">
					<button class="btn btn-login" onclick="loginUser()">Entrar</button>
				</div>


				<br>
				<p class="input-text">
					Não tem conta? <a href="./register.html">Cadastre sua empresa</a>
				</p>
				<p class="input-text">
					É funcionário? <a href="./register_employee.html">Cadastre-se com código</a>
				</p>
			</div>
		</div>
	</div>
</body>
<script src="../scripts/main.js"></script>

</html>
