<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" href="../images/LOGO.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="seta">
        <a href="../index.html">
            <img src="../images/Seta.svg" alt="">
        </a>
    </div>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-pill">
                <div class="icon">
                    <a href="../pages/dashboard.html">
                        <img src="../images/category.svg" alt="Dashboard">
                    </a>
                </div>
                <div class="icon" id="botao_perfil">
                    <a href="../pages/profile_page.html">
                        <img src="../images/Vector.svg" alt="Perfil">
                    </a>
                </div>
                <div class="icon">
                    <a href="../pages/heatmap.html">
                        <img src="../images/Chart.svg" alt="Perfil">
                    </a>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <header class="top-bar">
                <div class="logo">
                    <img src="../images/LOGO.svg" alt="Ícone Carro" class="logo-icon">
                    <span class="logo-text">SmartPark</span>
                </div>
                <div class="user-info">
                    SPTECH | sptech@sptech.school
                </div>
            </header>

            <div id="mural_alertas" class="alertas-container"></div>

            <section class="stats-grid">
                <div class="card date-card">
                    <h3 id="clock">8:02:09</h3>
                    <p>Segunda, 23/02/2027</p>
                </div>

                <div class="card" id="vagas-totais">
                    <div class="card-header">
                        <p>Total Vagas Ocupadas</p>
                    </div>
                    <h2 id="num-ocupacao">...</h2>
                </div>
                
                <div class="card tempo-medio">
                    <div class="card-header">
                        <p>Tempo de permanência média por vaga</p>
                    </div>
                    <h2 id="tempo-ocupacao">...</h2>
                </div>
            </section>

    <section class="charts-container">
        <div class="chart-card">
            <h4>Taxa de ocupação a cada 30 minutos</h4>
            <div class="chart-wrapper">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h4>Próximos dias</h4>
            <div class="chart-wrapper">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        <script src="../scripts/alert.js"></script>
    </section>
    </main>
    </div>
    <script src="../scripts/dash.js"></script>
</body>

</html>
