<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmartPark — Cadastro de Funcionário</title>
	<meta name="description" content="Cadastre-se como funcionário SmartPark usando o código da sua empresa.">
	<link rel="stylesheet" href="../css/login_reg.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="page">
		<div class="image-box image-box-login">
			<img class="image-login" src="../images/logo-image.svg" alt="SmartPark">
		</div>

		<div class="structure">
			<div class="home home-login">
				<a href="../index.html" class="btn-home btn">HOME</a>
			</div>

			<div class="form">
				<p class="title">CADASTRO DE FUNCIONÁRIO</p>

				<div class="card_erro" id="cardErro">
					<span id="error_message"></span>
				</div>

				<div id="codigoInfo" class="codigo_info">
					<strong>Como funciona?</strong> Seu gestor ou empresa fornecerá um código único. Insira-o abaixo para vincular seu cadastro.
				</div>

				<label class="input-text" for="ipt_codigo_empresa">Código da Empresa</label>
				<input type="text" class="input" id="ipt_codigo_empresa" placeholder="Ex: 38X2K9">
				<br>

				<label class="input-text" for="ipt_nome_func">Nome Completo</label>
				<input type="text" class="input" id="ipt_nome_func" placeholder="Seu nome">
				<br>

				<label class="input-text" for="ipt_email_func_reg">Email</label>
				<input type="email" class="input" id="ipt_email_func_reg" placeholder="seu@email.com">
				<br>

				<label class="input-text" for="ipt_passw_func">Senha</label>
				<input type="password" class="input" id="ipt_passw_func">
				<br>

				<label class="input-text" for="ipt_confirm_passw_func">Confirmar Senha</label>
				<input type="password" class="input" id="ipt_confirm_passw_func">

				<button class="btn btn-cadastro">Cadastrar</button>
				<br>
				<p class="input-text">Já tem conta? <a href="./login.html">Entre!</a></p>
				<p class="input-text">É gestor? <a href="./register.html">Cadastre sua empresa</a></p>
			</div>
		</div>
	</div>
</body>
<script src="../scripts/main.js"></script>
</html>
