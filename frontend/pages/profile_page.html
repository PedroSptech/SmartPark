<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="icon" href="../images/LOGO.svg">
</head>

<body>
    <div class="seta">
        <a href="../index.html">
            <img src="../images/Seta.svg" alt="">
        </a>
    </div>

    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-pill">
                <div class="icon">
                    <a href="../pages/dashboard.html">
                        <img src="../images/category-gray.svg" alt="Dashboard">
                    </a>
                </div>
                <div class="icon">
                    <a href="profile_page.html">
                        <img src="../images/Vector-blue.svg" alt="Perfil">
                    </a>
                </div>
                <div class="icon">
                    <a href="../pages/heatmap.html">
                        <img src="../images/Chart.svg" alt="Perfil">
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="logo">
                    <img src="../images/LOGO.svg" alt="Ícone Carro" class="logo-icon">
                    <span class="logo-text">SmartPark</span>
                </div>
            </header>

            <div class="card profile-card">

                <div class="profile-top">
                    <div class="avatar-circle">
                        <img src="../images/SPTech Logo.png" width="110px">
                    </div>
                    <p class="profile-name" id="nome_usuario">Carregando...</p>
                </div>

                <div class="profile-bottom">
                    <h3 class="profile-title">PERFIL DO EMPRESÁRIO</h3>
                    <p class="profile-cnpj" id="cnpj_usuario">Carregando CNPJ...</p>

                    <div id="lista_estacionamentos"></div>
                </div>
            </div>
            <div class="card func-card">
                <div class="func-header">
                    <h4 class="func-titulo">Funcionários</h4>
                    <button class="btn-estacionamento btn-acessar" onclick="openPopUp()">+ Adicionar</button>
                </div>
                <table class="func-projecao">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Estacionamento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="lista_funcionarios" class="lista-funcionarios"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!--TODO: FAZER CSS PARA POPUP-->

    <div id="formPopup" class="pop">
        <div class="pop-content">
            <span class="close-btn" id="closeFormBtn">&times;</span>
            <form>
            <h2>Cadastre um funcionario</h2>
            
            <div class="card_erro" id="cardErro">
                <span id="error_message"></span>
            </div>

            <div class="card_message" id="cardMessage">
                <span id="success_message"></span>
            </div>
            <input type="text" placeholder="Nome" id="ipt_nome_func">
            <input type="text" placeholder="Email" id="ipt_email_func">
            <input type="password" placeholder="Senha" id="ipt_passw_func">
            <button onclick="cadastrarFunc()">Cadastrar</button>
            </form>
        </div>
    </div>
    <script src="../scripts/profile.js"></script>
</body>

</html>
